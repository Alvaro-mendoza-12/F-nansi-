<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulta y edita tus recetas y precios guardados en Finansi.">
  <title data-i18n="title.products">Mis productos · Finansi</title>
  <link rel="icon" href="../prototipo/img/marca.svg" type="image/svg+xml">
  <script src="mvp/tema-inicial.js"></script>
  <link rel="stylesheet" href="../prototipo/estilos.css">
  <link rel="stylesheet" href="maqueta.css">
  <link rel="stylesheet" href="mvp/flujo.css">
  <script type="module" src="mvp/app.js"></script>
</head>
<body class="b demo demo-module " data-page="productos">
  <a class="skip-link" href="#contenido" data-i18n="ui.skip">Saltar al contenido</a>
  <header data-shared-header></header>
  <main class="demo-main" id="contenido" tabindex="-1">
    <noscript><p class="inline-note" data-i18n="ui.noScript">Activa JavaScript para usar el catálogo y calcular precios.</p></noscript>
    <div class="demo-heading">
      <div><h1 data-i18n="ui.myProducts">Mis productos</h1><p data-catalog-subtitle data-i18n="catalog.intro">Tus recetas y precios guardados en este navegador.</p></div>
      <div class="heading-actions">
        <a class="action primary" href="crear-producto.html" data-i18n="ui.create">Crear producto</a>
      </div>
    </div>
    <p class="form-error" data-load-error role="alert" hidden></p>
    <p class="inline-note" role="status" data-catalog-status hidden></p>
    <section data-saved-catalog aria-labelledby="saved-products">
      <h2 id="saved-products" class="sr-only" data-i18n="catalog.savedProducts">Productos guardados</h2>
      <div class="catalog-grid" data-product-list></div>
      <section class="dashboard-empty card" data-catalog-empty hidden>
        <h2 data-i18n="ui.catalogStart">Tu catálogo empieza con una receta</h2>
        <p data-i18n="catalog.empty">Guarda un producto después de comparar precios y lo encontrarás aquí al volver.</p>
        <a class="action primary" href="crear-producto.html" data-i18n="catalog.first">Crear mi primer producto</a>
      </section>
    </section>
    <template data-product-template>
      <article class="card saved-product">
        <div class="product-head">
          <div><p data-category></p><h3 data-name></h3></div>
          <span class="tag demo-tag neutral" data-price-status></span>
        </div>
        <dl class="product-values">
          <div><dt data-i18n="ui.unitCost">Costo por unidad</dt><dd data-cost></dd></div>
          <div><dt data-i18n="catalog.savedPrice">Precio guardado</dt><dd data-price></dd></div>
          <div><dt data-i18n="method.profit">Ganancia por unidad</dt><dd data-profit></dd></div>
        </dl>
        <div class="product-foot">
          <a class="action secondary" data-price-product data-i18n="nav.calc">Calcular precio</a>
          <a class="action secondary" data-open-product data-i18n="recipe.editLink">Editar receta</a>
          <button class="action quiet danger" type="button" data-delete-product data-i18n="catalog.remove">Eliminar</button>
        </div>
      </article>
    </template>
    <dialog class="demo-dialog" data-delete-dialog aria-labelledby="delete-title">
      <div class="dialog-head"><div><h2 id="delete-title" data-i18n="ui.deleteProduct">Eliminar producto</h2><p data-delete-description></p></div></div>
      <form data-delete-form>
        <p class="form-error" data-error role="alert" hidden></p>
        <div class="form-actions">
          <button type="button" class="action secondary" data-close-dialog data-i18n="ui.cancel" autofocus>Cancelar</button>
          <button type="submit" class="action primary" data-i18n="ui.confirmDelete">Confirmar eliminación</button>
        </div>
      </form>
    </dialog>
  </main>
  <nav data-shared-bottom></nav>
</body>
</html>
